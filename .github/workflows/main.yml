name: RaceDay CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: |
        if [ -f "TestProject1/TestProject1.csproj" ]; then
          dotnet restore
        else
          echo "TestProject1 not found on remote; restoring main project only."
          dotnet restore race_day/race_day.csproj
        fi

    - name: Build project
      run: |
        if [ -f "TestProject1/TestProject1.csproj" ]; then
          dotnet build --no-restore --configuration Release
        else
          dotnet build race_day/race_day.csproj --no-restore --configuration Release
        fi

    - name: Run Tests
      run: |
        if [ -f "TestProject1/TestProject1.csproj" ]; then
          dotnet test TestProject1/TestProject1.csproj --configuration Release --verbosity normal
        else
          echo "Skipping test execution until TestProject1 is pushed from local."
        fi
