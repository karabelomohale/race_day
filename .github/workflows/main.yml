name: RaceDay CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: |
        # Find any csproj or sln that actually exists on GitHub
        MAIN_PROJ=$(find . -name "*.csproj" ! -path "*/Test*" | head -n 1)
        echo "Found main project: $MAIN_PROJ"
        dotnet restore "$MAIN_PROJ"

    - name: Build project
      run: |
        MAIN_PROJ=$(find . -name "*.csproj" ! -path "*/Test*" | head -n 1)
        dotnet build "$MAIN_PROJ" --no-restore --configuration Release

    - name: Run Tests
      run: |
        TEST_PROJ=$(find . -name "*Test*.csproj" | head -n 1)
        if [ -n "$TEST_PROJ" ] && [ -f "$TEST_PROJ" ]; then
          echo "Found test project: $TEST_PROJ"
          dotnet test "$TEST_PROJ" --configuration Release --verbosity normal
        else
          echo "No test project detected in repository yet. Build succeeded."
        fi
