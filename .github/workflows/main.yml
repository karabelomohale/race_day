name: RaceDay CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Auto-Fix Folder Structure
      run: |
        echo "Checking for nested test folders..."
        # Finds TestProject1 if it is hidden inside the main project and moves it out
        TEST_DIR=$(find . -mindepth 2 -type d -name "TestProject1" | head -n 1)
        if [ -n "$TEST_DIR" ]; then
          echo "Moving $TEST_DIR out of the main project folder to prevent API compile errors..."
          mv "$TEST_DIR" ./TestProject1
        fi

    - name: Auto-Fix Packages and Project Links
      run: |
        MAIN_PROJ=$(find . -name "*.csproj" ! -path "*/Test*" | head -n 1)
        
        for proj in $(find . -name "*Test*.csproj"); do
          echo "Fixing packages and linking main project for $proj..."
          
          # Force the correct packages
          dotnet add "$proj" package xunit
          dotnet add "$proj" package Microsoft.NET.Test.Sdk
          dotnet add "$proj" package xunit.runner.visualstudio
          dotnet add "$proj" package FluentAssertions
          dotnet add "$proj" package Microsoft.AspNetCore.Mvc.Testing --version 8.0.0
          dotnet add "$proj" package Microsoft.EntityFrameworkCore.InMemory --version 8.0.0
          
          # Link the test project to the main API project dynamically
          sed -i '/<ProjectReference/d' "$proj"
          dotnet add "$proj" reference "$MAIN_PROJ"
        done

    - name: Build All Projects
      run: |
        for proj in $(find . -name "*.csproj"); do
          echo "Building $proj..."
          dotnet build "$proj" --configuration Release
        done

    - name: Run All Tests
      run: |
        for proj in $(find . -name "*Test*.csproj"); do
          echo "Testing $proj..."
          dotnet test "$proj" --configuration Release --verbosity normal
        done
