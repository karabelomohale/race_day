name: RaceDay CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Auto-Fix Missing Test Packages
      run: |
        for proj in $(find . -name "*Test*.csproj"); do
          echo "Fixing packages for $proj..."
          dotnet add "$proj" package xunit
          dotnet add "$proj" package Microsoft.NET.Test.Sdk
          dotnet add "$proj" package xunit.runner.visualstudio
          dotnet add "$proj" package FluentAssertions
          dotnet add "$proj" package Microsoft.AspNetCore.Mvc.Testing --version 8.0.0
          dotnet add "$proj" package Microsoft.EntityFrameworkCore.InMemory --version 8.0.0
        done

    - name: Build All Projects
      run: dotnet build --configuration Release

    - name: Run All Tests
      run: dotnet test --configuration Release --verbosity normal
